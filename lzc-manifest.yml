application:
  subdomain: baserow
  public_path:
  - /
  upstreams:
  - location: /
    backend: http://baserow:80/
  injects:
  - id: open-save-chooser
    'on': browser
    when:
    - /*
    do:
    - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  baserow:
    image: docker.1ms.run/baserow/baserow:2.4.1
    environment:
    - TZ=Asia/Shanghai
    - BASEROW_PUBLIC_URL=https://{{ .S.AppDomain }}
    - BASEROW_CADDY_ADDRESSES=:80
    - BASEROW_FRONTEND_COOKIE_PREFIX=baserow
    binds:
    - /lzcapp/var/data:/baserow/data
usage: 首次使用请按官方注册流程创建账号。保留 Baserow 自身登录鉴权。数据库和运行数据保存在应用内部持久目录。
